<!doctype html>
<!-- Khuôn banner B1 "Thẻ": ảnh trên, tiêu đề to, dải đỏ, 2–6 thẻ nội dung, chân hotline + nút.
     Kênh Du học Thầy Tư. 1080×1080 (chụp ở tỉ lệ 2 → 2160×2160).
     tools/banner_maker.py thay dòng __DATA__ và __BASE__ rồi chụp bằng Chrome chạy ẩn. -->
<html lang="vi"><head><meta charset="utf-8"><base href="__BASE__"><style>
@font-face{font-family:BVP;src:url(../../video/th-k4-chu-dong/assets/fonts/BeVietnamPro-Medium.ttf);font-weight:500}
@font-face{font-family:BVP;src:url(../../video/th-k4-chu-dong/assets/fonts/BeVietnamPro-SemiBold.ttf);font-weight:600}
@font-face{font-family:BVP;src:url(../../video/th-k4-chu-dong/assets/fonts/BeVietnamPro-Bold.ttf);font-weight:700}
@font-face{font-family:BVP;src:url(../../video/th-k4-chu-dong/assets/fonts/BeVietnamPro-ExtraBold.ttf);font-weight:800}
@font-face{font-family:BVP;src:url(../../video/th-k4-chu-dong/assets/fonts/BeVietnamPro-Black.ttf);font-weight:900}
:root{--xanh:#1E6FE8;--dam:#263E8B;--do:#E81E37;--vang:#FFE360;--s:1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:BVP;background:linear-gradient(180deg,#2D82EC 0%,#1E6FE8 55%,#1a5fd0 100%);position:relative;color:var(--dam)}
.photo{position:absolute;left:40px;right:40px;top:40px;height:330px;border-radius:36px;background:center/cover;overflow:hidden}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,111,232,.15) 20%,#1E6FE8 100%)}
.logo{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;background:#fff url(assets/tt-tron.png) center/86% no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:3}
.ai{position:absolute;top:52px;right:58px;z-index:3;background:rgba(0,0,0,.45);color:#fff;font-size:15px;font-weight:600;padding:4px 12px;border-radius:20px}
.head{position:absolute;left:64px;right:64px;top:250px;z-index:2;color:#fff}
.sub{font-weight:500;font-size:34px}
.big{font-weight:900;font-size:104px;line-height:1.02;letter-spacing:-1px;margin-top:6px;text-shadow:0 4px 0 rgba(38,62,139,.35);white-space:nowrap}
.brush{display:inline-block;margin-top:14px;background:var(--do);color:#fff;font-weight:800;font-size:31px;padding:10px 30px 12px;border-radius:6px 40px 6px 40px;transform:rotate(-1.5deg);box-shadow:0 5px 0 rgba(0,0,0,.12)}
.body{position:absolute;left:40px;right:40px;bottom:96px;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:calc(18px*var(--s))}
.items.one{grid-template-columns:1fr}
.st{background:#fff;border-radius:24px;padding:calc(26px*var(--s)) 22px;display:flex;gap:16px;align-items:center;box-shadow:0 6px 16px rgba(20,40,120,.18)}
.st.wide{grid-column:1/3}
.st.hl{background:var(--vang)}
.n{flex:none;width:calc(58px*var(--s));height:calc(58px*var(--s));border-radius:50%;background:var(--xanh);color:#fff;font-weight:900;font-size:calc(30px*var(--s));display:flex;align-items:center;justify-content:center}
.st.hl .n{background:var(--do)}
.t b{display:block;font-weight:800;font-size:calc(25px*var(--s));line-height:1.2}
.t span{display:block;font-weight:500;font-size:calc(19px*var(--s));color:#4a5680;line-height:1.3;margin-top:2px}
.note{text-align:center;color:#fff;font-weight:600;font-size:24px}
.note b{color:var(--vang)}
.small{text-align:center;margin-top:-6px;color:rgba(255,255,255,.75);font-size:15px;font-weight:500}
.foot{position:absolute;left:40px;right:40px;bottom:22px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:17px;font-weight:500}
.foot b{font-weight:800}
.cta{background:var(--do);color:#fff;font-weight:800;font-size:22px;padding:12px 28px;border-radius:40px;border:3px solid #fff}
</style></head><body>
<div class="photo" id="photo"></div><div class="logo"></div>
<div class="head"><div class="sub" id="eyebrow"></div><div class="big" id="title"></div><div class="brush" id="label"></div></div>
<div class="body" id="body"><div class="items" id="items"></div>
<div class="note" id="note"></div>
<div class="small" id="small"></div></div>
<div class="foot"><div><b>Địa chỉ:</b> 79 Ngụy Như Kon Tum, Thanh Xuân, Hà Nội<br><b>Hotline:</b> 0967 593 548</div><div class="cta" id="cta"></div></div>
<script>
const D = __DATA__;
const CHECK = '<svg viewBox="0 0 24 24" width="55%" height="55%"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");   // **chữ** → in đậm (vàng ở dòng ghi chú)
$("photo").style.backgroundImage = `url(${D.photo || "assets/campus.jpg"})`;
if (D.photo_ai) document.body.insertAdjacentHTML("beforeend", '<div class="ai">Ảnh minh họa AI</div>');
$("eyebrow").textContent = D.eyebrow || "";
$("title").textContent = D.title || "";
$("label").textContent = D.label || "";
$("note").innerHTML = bold(D.note);
$("small").textContent = D.small || "";
$("cta").textContent = (D.cta || "Nhận tư vấn ngay").toUpperCase();
const items = D.items || [], n = items.length, box = $("items");
if (n <= 3) box.classList.add("one");
items.forEach((it, i) => {
  const wide = n > 3 && n % 2 === 1 && i === n - 1;
  const hl = D.highlight_last && i === n - 1;
  box.insertAdjacentHTML("beforeend",
    `<div class="st${wide ? " wide" : ""}${hl ? " hl" : ""}"><div class="n">${D.numbered === false ? CHECK : i + 1}</div>` +
    `<div class="t"><b>${esc(it.title)}</b>${it.desc ? `<span>${esc(it.desc)}</span>` : ""}</div></div>`);
});
document.fonts.ready.then(() => {
  // Tiêu đề to: thu nhỏ cho vừa ngang.
  const t = $("title"); let fs = 104;
  while (t.scrollWidth > t.clientWidth && fs > 56) t.style.fontSize = (fs -= 2) + "px";
  // Nội dung: bắt đầu dưới dải đỏ, giãn đều tới chân; 1 cột thì chữ to hơn, tràn thì thu nhỏ.
  const body = $("body");
  body.style.top = (document.querySelector(".head").getBoundingClientRect().bottom + 30) + "px";
  if (!D.note) $("note").remove();
  if (!D.small) $("small").remove();
  let s = n <= 3 ? 1.3 : 1.1;
  const set = () => document.documentElement.style.setProperty("--s", s.toFixed(2));
  set();
  while (body.scrollHeight > body.clientHeight + 1 && s > 0.6) { s -= 0.04; set(); }
  document.title = "ready";
});
</script></body></html>
